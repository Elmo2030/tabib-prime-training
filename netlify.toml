# Static site: nothing to build, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# HTML must always be revalidated so a new deploy reaches users immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are content-stable — cache them hard so repeat visits are instant.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted fonts are versioned by filename — cache them hard.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Deck sources live in src/ and are not part of the published site.
[[headers]]
  for = "/src/*"
  [headers.values]
    X-Robots-Tag = "noindex"
